# Gradle 8.7 (this project's pinned wrapper version, see gradle/wrapper/) can
# only run on JDK 21 or older. Android Studio's own bundled JDK is newer than
# that, so without this, Android Studio's "#GRADLE_LOCAL_JAVA_HOME" project
# setting (.idea/gradle.xml) falls back to that too-new JDK and sync fails
# with a "Configuration.fileCollection(Spec)" error. Pinning it here fixes
# both IDE sync and command-line ./gradlew builds without touching IDE
# settings or environment variables.
